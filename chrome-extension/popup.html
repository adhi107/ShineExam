<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victory Study Circle</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="vsc-popup">
    <div class="vsc-header">
      <img src="icon48.png" alt="Victory Study Circle Logo" class="vsc-logo">
      <div>
        <h2 class="vsc-title">Victory Study Circle</h2>
        <p class="vsc-sub">The Right Place for Success</p>
      </div>
    </div>
    
    <div class="vsc-body">
      <div class="vsc-quick-badge">🏛️ UPSC & State PSC Examination Portal</div>
      <p class="vsc-desc">Quickly access mock tests, daily test series, descriptive evaluations, and current affairs.</p>
      
      <a href="http://localhost:3000" target="_blank" class="vsc-btn vsc-btn-primary" id="openPortalBtn">
        🚀 Launch Exam Portal
      </a>
    </div>
    
    <div class="vsc-footer">
      <span>Visakhapatnam • Victory Study Circle</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
