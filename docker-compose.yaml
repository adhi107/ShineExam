version: "3.9"

services:
  exam-portal-backend:
    build: ./backend
    container_name: exam_app_backend
    restart: always
    network_mode: "host"
    env_file:
      - ./backend/.env
    volumes:
      # Persistent host-bind mount: all uploaded videos, PDFs, and handouts stay permanently on the host disk
      - ./backend/uploads:/app/uploads

  exam-portal-frontend:
    build: ./frontend
    container_name: exam_app_frontend
    restart: always
    network_mode: "host"
    env_file:
      - ./frontend/.env
    depends_on:
      - exam-portal-backend
